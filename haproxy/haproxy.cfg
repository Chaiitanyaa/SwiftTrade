global
    #log stdout format raw local0
    maxconn 500000  # Max connections HAProxy can handle
    nbthread 4      # Number of threads per process (adjust for multi-core CPUs)

defaults
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    timeout queue 60s
    log global
    option httplog
    mode http

frontend http_front
    bind *:8080
    maxconn 500000
    default_backend nginx_servers

backend nginx_servers
    mode http
    balance leastconn  # Use least connections for better load distribution
    option httpchk GET /
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost

    timeout check 5s
    timeout connect 5s
    timeout server 60s
    timeout queue 120s

    option redispatch  
    retries 3  

    # Adding more Nginx servers
    server nginx1 nginx_1:1900 check inter 5s rise 3 fall 10 maxconn 200000
    server nginx2 nginx_2:1901 check inter 5s rise 3 fall 10 maxconn 200000
    server nginx3 nginx_3:1902 check inter 5s rise 3 fall 10 maxconn 200000
    server nginx4 nginx_4:1903 check inter 5s rise 3 fall 10 maxconn 200000
