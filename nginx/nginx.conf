worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 200000;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 600s;
    keepalive_requests 500000;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    lua_shared_dict cache 10m;  # Shared memory for caching
    lua_shared_dict rate_limit 1m;  # Shared memory for rate limiting

    upstream trading_backend {
        ip_hash;  # Sticky session persistence
        least_conn;  # Load balance based on least connections
        server backend:3001 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 1900;

        location / {
            set $cache_key "$uri?$args";

            # Use Lua to cache API responses
            content_by_lua_block {
                local cache = ngx.shared.cache
                local res = cache:get(ngx.var.cache_key)

                if res then
                    ngx.say(res)  -- Return cached response
                    return
                end

                local res = ngx.location.capture("/proxy_backend")

                if res.status == 200 then
                    cache:set(ngx.var.cache_key, res.body, 10)  -- Store in cache for 10 seconds
                    ngx.say(res.body)
                else
                    ngx.exit(res.status)
                end
            }
        }

        location /proxy_backend {
            internal;
            proxy_pass http://trading_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate limiting to prevent API abuse
        location /api/ {
            access_by_lua_file /usr/local/openresty/nginx/lua-scripts/rate_limit.lua;
            proxy_pass http://trading_backend;
        }
    }
}
