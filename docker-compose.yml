services:
  backend:
    build:
      context: ./Backend/server
      dockerfile: Dockerfile
    deploy:
      replicas: 10 # 10 backend instances
      restart_policy:
        condition: any
    expose:
      - "3001"
    networks:
      - trading_network
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    container_name: trading_mongo
    restart: always
    ports:
      - "27017:27017"
    networks:
      - trading_network
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: trading_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - trading_network
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    deploy:
      replicas: 3 # 3 Nginx instances for load balancing
      restart_policy:
        condition: any
      placement:
        constraints: [node.role == worker] # Run on worker nodes
    ports:
      - "1900:1900" # Exposing the same port for all Nginx instances
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - trading_network
    depends_on:
      - backend

networks:
  trading_network:

volumes:
  mongo_data:
  redis_data: