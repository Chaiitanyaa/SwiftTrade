version: '3.8'

services:
  backend_1:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: trading_backend_1
    restart: always
    expose:
      - "3001"
    depends_on:
      - mongo
      - redis
      - rabbitmq
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq
      
    networks:
      - trading_network

  backend_2:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: trading_backend_2
    restart: always
    expose:
      - "3001"
    depends_on:
      - mongo
      - redis
      - rabbitmq
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq
    networks:
      - trading_network

  backend_3:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: trading_backend_3
    restart: always
    expose:
      - "3001"
    depends_on:
      - mongo
      - redis
      - rabbitmq
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq
    networks:
      - trading_network

  backend_4:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: trading_backend_4
    restart: always
    expose:
      - "3001"
    depends_on:
      - mongo
      - redis
      - rabbitmq
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq
    networks:
      - trading_network

  # Worker service that processes RabbitMQ messages for user registration & login
  worker:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: trading_worker
    restart: always
    depends_on:
      - rabbitmq
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - RABBITMQ_URL=amqp://rabbitmq
    networks:
      - trading_network
    command: ["node", "src/workers/userWorker.js"]  # Runs the worker service

  # MongoDB service for storing user and trading data
  mongo:
    image: mongo:latest
    container_name: trading_mongo
    restart: always
    ports:
      - "27017:27017"
    networks:
      - trading_network
    volumes:
      - mongo_data:/data/db

  # Redis service for caching and session management
  redis:
    image: redis:latest
    container_name: trading_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - trading_network
    volumes:
      - redis_data:/data

  # RabbitMQ message broker for handling async tasks like user registration & login
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: trading_rabbitmq
    restart: always
    ports:
      - "5672:5672"  # Main RabbitMQ connection
      - "15672:15672" # Management UI
    networks:
      - trading_network

  # Nginx as a reverse proxy to distribute traffic to backend instances
  nginx:
    image: nginx:latest
    container_name: trading_nginx
    restart: always
    depends_on:
      - backend_1
      - backend_2
      - backend_3
      - backend_4
    ports:
      - "1900:1900"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - trading_network

networks:
  trading_network:

volumes:
  mongo_data:
  redis_data:
