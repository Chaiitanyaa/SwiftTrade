services:
    
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: trading_rabbitmq
    restart: always
    ports:
      - "5672:5672"  # ✅ RabbitMQ Connection
      - "15672:15672" # ✅ RabbitMQ Web UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-kernel inet_dist_listen_min 9100 inet_dist_listen_max 9155
    command: ["rabbitmq-server", "--set_policy", "prefetch_policy", ".*", "{\"prefetch_count\":50}", "--apply-to", "queues"]
    networks:
      - trading_network

    
  backend_1:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: trading_backend_1
    restart: always
    expose:
      - "3001"
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017/tradingDB
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - trading_network

